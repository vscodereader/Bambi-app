# apps/server → GCP Cloud Run 배포
# - main 브랜치  → bambi-server      (production 환경)
# - develop 브랜치 → bambi-server-dev (test 환경)
# 인증은 Workload Identity Federation(키리스). 초기 셋업: scripts/setup-gcp-cloud-run.sh
name: deploy-server

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/server/**"
      - "packages/api/**"
      - "packages/auth/**"
      - "packages/db/**"
      - "packages/env/**"
      - "packages/config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".github/workflows/deploy-server.yml"

concurrency:
  group: deploy-server-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: bambi-app-501604
  REGION: asia-northeast3
  REPOSITORY: bambi
  SERVICE: ${{ github.ref_name == 'main' && 'bambi-server' || 'bambi-server-dev' }}
  SQL_INSTANCE: ${{ github.ref_name == 'main' && 'bambi-prod' || 'bambi-dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'test' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/server:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/server:${{ github.ref_name }}
          cache-from: type=gha,scope=server-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=server-${{ github.ref_name }}

      # ── DB 마이그레이션 (배포 전) ──────────────────────────────
      # cloud-sql-proxy를 유닉스 소켓 모드(/cloudsql)로 띄우면 Secret Manager의
      # DATABASE_URL(소켓 형식)을 그대로 사용할 수 있다. 마이그레이션이 실패하면
      # 배포 스텝이 실행되지 않아 이전 revision이 그대로 유지된다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install db workspace deps
        run: pnpm install --frozen-lockfile --filter @bambi-app/db...

      - name: Run DB migrations
        run: |
          DBURL="$(gcloud secrets versions access latest --secret="${SERVICE}-database-url")"
          echo "::add-mask::${DBURL}"
          sudo mkdir -p /cloudsql && sudo chown "$USER" /cloudsql
          curl -sSfL -o /tmp/cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.23.0/cloud-sql-proxy.linux.amd64"
          chmod +x /tmp/cloud-sql-proxy
          /tmp/cloud-sql-proxy --unix-socket /cloudsql "${PROJECT_ID}:${REGION}:${SQL_INSTANCE}" --quiet &
          PROXY_PID=$!
          SOCKET="/cloudsql/${PROJECT_ID}:${REGION}:${SQL_INSTANCE}/.s.PGSQL.5432"
          for i in $(seq 1 30); do [ -S "${SOCKET}" ] && break; sleep 1; done
          [ -S "${SOCKET}" ] || { echo "프록시 소켓 준비 실패"; exit 1; }
          (cd packages/db && DATABASE_URL="${DBURL}" pnpm exec drizzle-kit migrate)
          kill "${PROXY_PID}"

      # 서버는 23000에 listen → --port=23000 으로 Cloud Run 프로브를 맞춘다.
      # socket.io가 인메모리(어댑터 없음)라 당분간 --max-instances=1 로 고정.
      # 웹소켓 유지를 위해 --timeout, --session-affinity 설정.
      # --timeout은 "요청 하나가 살아 있을 수 있는 시간"이라 WebSocket·SSE 수명 상한이기도 하다.
      # 최대치(3600)로 두면 새 리비전을 배포해도 옛 리비전에 붙은 소켓이 최대 1시간 남아
      # "옛 인스턴스의 소켓 + 새 인스턴스에서 처리되는 메시지"라는 조합이 그동안 계속된다
      # (팬아웃이 프로세스 로컬이라 그 사용자는 실시간을 한 건도 못 받는다). 900초로 낮춰
      # 잔류 창을 15분으로 줄인다 — 클라이언트는 끊기면 재연결·방 재입장을 스스로 한다.
      # 민감 값은 GCP Secret Manager에서 주입(--set-secrets) — GitHub에는 시크릿 없음.
      # BAMBI_GUEST_TOKEN_SECRET은 web(Vercel)에 넣은 값과 반드시 같아야 한다 — web이 서명한
      # 게스트 토큰을 이 서버가 검증한다. 시크릿 이름: ${SERVICE}-bambi-guest-token-secret.
      # GCS 자격 증명은 주입하지 않는다(JSON 키 없음). 런타임 SA로 ADC가 해결하고,
      # 서명 URL은 IAM signBlob으로 만든다 — 권한 부여는 scripts/setup-gcp-cloud-run.sh 참고.
      - name: Deploy to Cloud Run
        env:
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          # 공고 이미지·광고 배너용 공개 버킷. dev/prod가 다른 버킷을 쓰며, 이름은
          # 레포에 남기지 않고 GitHub 환경 변수(test/production)로 주입한다.
          GCS_PUBLIC_BUCKET: ${{ vars.GCS_PUBLIC_BUCKET }}
          # 사업자 문서 등 민감 서류 전용 비공개 버킷(test=bambi-storage-private,
          # production=bambi-storage-prod-private). 값이 비면 env 패키지가 undefined로
          # 정규화하고 업로드가 default-deny로 거부된다 — 공개 버킷 폴백 없음.
          GCS_PRIVATE_BUCKET: ${{ vars.GCS_PRIVATE_BUCKET }}
          # 세션 쿠키 prefix를 환경별로 분리. dev/prod가 같은 apex(.bambialba.com)를
          # 공유하므로 prefix가 같으면 쿠키가 서로 덮어써 세션이 충돌한다.
          BAMBI_COOKIE_PREFIX: ${{ github.ref_name == 'main' && 'bambi' || 'bambi-dev' }}
        run: |
          gcloud run deploy "$SERVICE" \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/server:${GITHUB_SHA}" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --platform=managed \
            --port=23000 \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=1 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=900 \
            --session-affinity \
            --add-cloudsql-instances="${PROJECT_ID}:${REGION}:${SQL_INSTANCE}" \
            --set-env-vars="^##^NODE_ENV=production##BETTER_AUTH_URL=${BETTER_AUTH_URL}##CORS_ORIGIN=${CORS_ORIGIN}##GCP_PROJECT_ID=${PROJECT_ID}##GCS_PUBLIC_BUCKET=${GCS_PUBLIC_BUCKET}##GCS_PRIVATE_BUCKET=${GCS_PRIVATE_BUCKET}##BAMBI_COOKIE_PREFIX=${BAMBI_COOKIE_PREFIX}" \
            --set-secrets="DATABASE_URL=${SERVICE}-database-url:latest,BETTER_AUTH_SECRET=${SERVICE}-better-auth-secret:latest,PORTONE_API_SECRET=${SERVICE}-portone-api-secret:latest,BAMBI_GUEST_TOKEN_SECRET=${SERVICE}-bambi-guest-token-secret:latest"

      - name: Show service URL
        run: |
          gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$PROJECT_ID" \
            --format='value(status.url)'
